name: secret-scan
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: obico-docker-runner
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists PR commits via the API
    steps:
      # Checkout (PR head SHA, full history) + gitleaks live in the action, so
      # a fix ships to every repo by moving v1 (homelab#2079).
      - uses: dvystrcil/secret-scan-action@v1
